name: Saved-deck release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saved-deck-filters:
    name: Saved-deck level filter UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install mobile UI test dependencies
        run: pnpm --filter @workspace/skillswipe... install --frozen-lockfile
      - name: Run saved-deck level filter UI checks
        run: pnpm --filter @workspace/skillswipe run test:saved-deck-filters
  saved-decks:
    name: API routes and MongoDB lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install API test dependencies
        run: pnpm --filter @workspace/api-server... install --frozen-lockfile
      - name: Start disposable transaction-capable MongoDB
        run: |
          docker run -d --name skillswipe-test-mongo -p 127.0.0.1:27018:27018 \
            mongo:8.0 --replSet skillswipe-test --bind_ip_all --port 27018
          for attempt in $(seq 1 30); do
            if docker exec skillswipe-test-mongo mongosh --port 27018 --quiet \
              --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'; then break; fi
            sleep 1
          done
          docker exec skillswipe-test-mongo mongosh --port 27018 --quiet \
            --eval 'rs.initiate({_id:"skillswipe-test",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          docker exec skillswipe-test-mongo mongosh --port 27018 --quiet \
            --eval 'for(let i=0;i<60;i++){if(db.hello().isWritablePrimary)quit(0);sleep(1000)};quit(1)'
      - name: Run required saved-deck checks
        run: pnpm --filter @workspace/api-server run test:ci
        env:
          SKILLSWIPE_TEST_MONGODB_URI: mongodb://127.0.0.1:27018/skillswipe_test
          SKILLSWIPE_TEST_MONGODB_DATABASE: skillswipe_test
      - name: Remove disposable MongoDB
        if: always()
        run: docker rm -f skillswipe-test-mongo || true
