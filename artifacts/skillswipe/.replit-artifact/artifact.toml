kind = "mobile"
previewPath = "/"
title = "SkillSwipe"
description = "A native flashcard study app for learners to practice sample question-and-answer decks by swiping through cards, revealing answers, and tracking their session progress."
version = "1.0.0"
id = "artifacts/skillswipe"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20616

[services.development]
run = "pnpm --filter @workspace/skillswipe run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/skillswipe", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/skillswipe", "run", "serve" ]

[services.env]
PORT = "20616"
BASE_PATH = "/"
