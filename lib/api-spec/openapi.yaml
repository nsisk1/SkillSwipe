openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - bearerAuth: []
tags:
  - name: health
    description: Health operations
  - name: flashcards
    description: Flashcard generation operations
paths:
  /flashcards/recovery/review:
    post:
      operationId: reviewLegacyDeck
      tags: [flashcards]
      summary: Review one independently verified legacy deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyRecoveryInput"
      responses:
        "200":
          description: Deck approved for this account, without transferring ownership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeck"
        "400":
          description: Invalid recovery code format
        "401":
          description: Sign-in required
        "404":
          description: Code unavailable, expired, or not approved for this account
        "503":
          description: Storage unavailable
  /flashcards/recovery/transfer:
    post:
      operationId: transferLegacyDeck
      tags: [flashcards]
      summary: Explicitly accept a verified legacy deck into the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyRecoveryInput"
      responses:
        "200":
          description: Transferred deck, including original study progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeck"
        "400":
          description: Invalid recovery code format
        "401":
          description: Sign-in required
        "404":
          description: Code unavailable, expired, or not approved for this account
        "503":
          description: Storage unavailable
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /flashcards/generate:
    post:
      operationId: generateFlashcards
      tags: [flashcards]
      summary: Generate a flashcard deck
      description: Creates a validated set of study cards for a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardGenerationInput"
      responses:
        "200":
          description: Generated flashcards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardGenerationResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Flashcard generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Deck storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /flashcards/decks:
    get:
      operationId: listFlashcardDecks
      tags: [flashcards]
      summary: List saved flashcard decks
      responses:
        "200":
          description: Saved deck summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeckList"
        "503":
          description: Deck storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /flashcards/decks/{deckId}:
    get:
      operationId: getFlashcardDeck
      tags: [flashcards]
      summary: Get a saved flashcard deck
      parameters:
        - name: deckId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved deck and study progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeck"
        "404":
          description: Deck not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Deck storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /flashcards/decks/{deckId}/progress:
    patch:
      operationId: updateFlashcardProgress
      tags: [flashcards]
      summary: Save progress for a flashcard
      parameters:
        - name: deckId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFlashcardProgressInput"
      responses:
        "200":
          description: Updated deck and study progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeck"
        "400":
          description: Invalid progress update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Deck or card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Deck storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /flashcards/decks/{deckId}/restart:
    post:
      operationId: restartFlashcardDeck
      tags: [flashcards]
      summary: Reset study progress for a deck
      parameters:
        - name: deckId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restarted deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeck"
        "404":
          description: Deck not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Deck storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LegacyRecoveryInput:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[0-9a-f-]{36}\.[0-9a-f]{64}$'
          minLength: 101
          maxLength: 101
      required: [code]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FlashcardGenerationInput:
      type: object
      properties:
        topic:
          type: string
          minLength: 2
          maxLength: 120
        cardCount:
          type: integer
          minimum: 3
          maximum: 10
          default: 6
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced, easy, medium, hard]
          default: intermediate
      required:
        - topic
        - cardCount
    Flashcard:
      type: object
      properties:
        id:
          type: string
        topic:
          type: string
        question:
          type: string
        answer:
          type: string
        status:
          type: string
          enum: [new, known, again]
      required:
        - id
        - topic
        - question
        - answer
        - status
    FlashcardGenerationResult:
      type: object
      properties:
        id:
          type: string
        topic:
          type: string
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced, easy, medium, hard]
        cards:
          type: array
          minItems: 3
          maxItems: 10
          items:
            $ref: "#/components/schemas/Flashcard"
        activeIndex:
          type: integer
          minimum: 0
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - topic
        - cards
        - activeIndex
        - createdAt
        - updatedAt
    FlashcardDeck:
      $ref: "#/components/schemas/FlashcardGenerationResult"
    FlashcardDeckSummary:
      type: object
      properties:
        id:
          type: string
        topic:
          type: string
        difficulty:
          type: string
          description: Learner level, omitted for decks saved without level metadata.
          enum: [beginner, intermediate, advanced, easy, medium, hard]
        cardCount:
          type: integer
        knownCount:
          type: integer
        activeIndex:
          type: integer
        updatedAt:
          type: string
      required:
        - id
        - topic
        - cardCount
        - knownCount
        - activeIndex
        - updatedAt
    FlashcardDeckList:
      type: object
      properties:
        decks:
          type: array
          items:
            $ref: "#/components/schemas/FlashcardDeckSummary"
      required:
        - decks
    UpdateFlashcardProgressInput:
      type: object
      properties:
        cardId:
          type: string
        status:
          type: string
          enum: [known, again]
        activeIndex:
          type: integer
          minimum: 0
          maximum: 10
      required:
        - cardId
        - status
        - activeIndex
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

