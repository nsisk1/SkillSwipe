openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: flashcards
    description: Flashcard generation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /flashcards/generate:
    post:
      operationId: generateFlashcards
      tags: [flashcards]
      summary: Generate a flashcard deck
      description: Creates a validated set of study cards for a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardGenerationInput"
      responses:
        "200":
          description: Generated flashcards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardGenerationResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Flashcard generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FlashcardGenerationInput:
      type: object
      properties:
        topic:
          type: string
          minLength: 2
          maxLength: 120
        cardCount:
          type: integer
          minimum: 3
          maximum: 10
          default: 6
      required:
        - topic
        - cardCount
    Flashcard:
      type: object
      properties:
        id:
          type: string
        topic:
          type: string
        question:
          type: string
        answer:
          type: string
      required:
        - id
        - topic
        - question
        - answer
    FlashcardGenerationResult:
      type: object
      properties:
        topic:
          type: string
        cards:
          type: array
          minItems: 3
          maxItems: 10
          items:
            $ref: "#/components/schemas/Flashcard"
      required:
        - topic
        - cards
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

